name: Deploy to droplet

on:
  # Manual-only until the deploy secrets exist. Add `push: { branches: [main] }`
  # here to enable auto-deploy on every push to main afterwards.
  workflow_dispatch: {}

concurrency:
  group: deploy-review-aggregator
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts

      # The droplet updates itself from GitHub via the idempotent deploy script
      # (git reset to origin/main, composer install, migrate, restart). Running
      # it here just triggers that pull.
      - name: Run deploy script on droplet
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: ssh root@${HOST} 'bash -s' < deploy/first-deploy.sh
